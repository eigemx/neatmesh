name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Check for oversized files
      run: |
        find . -path ./.git -prune -o -type f -size +5M -print | tee /tmp/large_files.txt
        if [ -s /tmp/large_files.txt ]; then
          echo "::error::Tracked files larger than 5MB are not allowed. Use a generated/coarser fixture."
          exit 1
        fi
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest numpy meshio
        pip install .
    - name: Lint
      run: |
        ruff check . --diff
        ruff format . --check
    - name: Test with pytest
      run: |
        pytest
